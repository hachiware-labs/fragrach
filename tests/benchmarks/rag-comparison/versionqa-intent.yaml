id: versionqa
goal: Answer technical documentation questions using the document version requested by the user, and preserve version history when the question asks what changed or which versions exist.
users:
  - software-engineer
  - technical-writer
  - release-manager
tasks:
  - distinguish document families and their individual versions
  - retrieve content from the explicitly requested version
  - list the versions present in the supplied corpus without inventing absent versions
  - compare adjacent versions when the question asks when or how content changed
  - keep superseded versions as historical evidence without using them as the current answer by default
questions:
  - What does the requested documentation version say?
  - Which versions of this document are present?
  - What changed between adjacent versions?
requirements:
  evidence_required: true
  temporal_scope_required: false
  unresolved_conflicts_allowed: true
