# Local Neo4j configuration for Fragrach comparison benchmarks.
# Runtime data is intentionally kept outside the repository.
server.directories.data=D:/data/fragrach-evaluation/neo4j/data
server.directories.logs=D:/data/fragrach-evaluation/neo4j/logs
server.directories.run=D:/data/fragrach-evaluation/neo4j/run

# Evaluation access is local-only. Do not expose these listeners externally.
server.default_listen_address=127.0.0.1
server.default_advertised_address=localhost
server.bolt.enabled=true
server.bolt.listen_address=:7687
server.http.enabled=true
server.http.listen_address=:7474
server.https.enabled=false

# Conservative defaults for a developer workstation.
server.memory.heap.initial_size=1g
server.memory.heap.max_size=4g
server.memory.pagecache.size=4g

dbms.security.auth_enabled=true

# Keep local benchmark activity local.
dbms.usage_report.enabled=false
client.allow_telemetry=false
server.bolt.telemetry.enabled=false
