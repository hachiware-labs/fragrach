id: incident_change
goal: 初報、最終報、変更申請、リリース記録から原因と対策の実施状態を説明する
users:
  - incident-responder
  - engineer
  - service-owner
tasks:
  - 初期見解と確定原因を区別する
  - 暫定対応と恒久対策を区別する
  - 承認と本番適用の両方を確認する
questions:
  - 確定原因と暫定対応は何か
  - 恒久対策は提案か実施済みか
requirements:
  evidence_required: true
  temporal_scope_required: true
  unresolved_conflicts_allowed: true
