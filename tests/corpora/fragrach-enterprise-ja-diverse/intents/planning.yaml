id: planning
goal: 初期提案、比較分析、正式決定、実施計画を区別して採用案と理由を説明する
users:
  - planner
  - project-leader
  - reviewer
tasks:
  - 提案と正式決定を区別する
  - 採用理由を決定記録から確認する
  - 不採用案を現行計画へ混入させない
questions:
  - 正式採用された方式と理由は何か
  - 初期提案は現在も実施対象か
requirements:
  evidence_required: true
  temporal_scope_required: true
  unresolved_conflicts_allowed: true
