id: governance
goal: 対象日時点の正式な規程と承認要件を、旧版や未更新案内との関係を含めて示す
users:
  - department-member
  - manager
  - internal-auditor
tasks:
  - 現行版と旧版を適用時点で区別する
  - 正式規程と未更新FAQの食い違いを開示する
  - 承認記録から施行状態を確認する
questions:
  - 対象日時点で有効な規則は何か
  - 案内と正式規程が食い違う場合はどう扱うか
requirements:
  evidence_required: true
  temporal_scope_required: true
  unresolved_conflicts_allowed: false
