[workspace]
members = [
    "crates/fragarach-cli",
    "crates/fragarach-build",
    "crates/fragarach-core",
    "crates/fragarach-ir",
    "crates/fragarach-llm",
    "crates/fragarach-parser",
    "crates/fragarach-resolver",
    "crates/fragarach-workspace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive"] }
globset = "0.4.18"
rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
